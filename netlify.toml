[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Phase 8 -- redirect the secondary domain to the primary one.
# cherub-atelier.fr is the primary domain in Netlify; cherub-atelier.com is
# added as a domain alias (LAUNCH_CHECKLIST.md Phase 8-A/B). Netlify domain
# aliases serve identical content with NO automatic redirect by default
# (confirmed against Netlify's own docs, 2026-09-26) -- without this rule,
# Google would see the same content live at two domains and have to guess
# which is canonical, which can dilute search ranking. Placed BEFORE the
# root redirect below on purpose: Netlify takes the first matching rule,
# and the hostless "from = /" rule would otherwise fire first even for
# .com requests, rewriting the path but leaving the visitor on .com.
# Mum has final say on which domain is primary -- see MUM_TODO.md's
# "Le nom de l'adresse du site" section. If she picks .com instead, swap
# the two domains below; for no redirect at all, delete this block.
# Full reasoning: PLAN.md SS16. Does nothing until DNS actually points
# .com at Netlify (Phase 8-B) -- Force HTTPS (site-wide, Phase 8-B) covers
# the http-to-https case, no separate rule needed for that.
[[redirects]]
  from = "https://cherub-atelier.com/*"
  to = "https://cherub-atelier.fr/:splat"
  status = 301
  force = true

# Redirect root to French homepage
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

# Security headers — Phase 6
#
# CSP built from a full source audit (2026-09-19), not a generic template:
#   - script-src 'self': the only client script is the gallery filter
#     (src/pages/fr/galerie.astro), a bare <script> Astro bundles to an
#     external hashed file — no inline scripts, no third-party JS anywhere.
#   - style-src 'self': all CSS is scoped <style> blocks (compiled to
#     external stylesheets) or src/styles/global.css. The three inline
#     style="" attributes that existed on 2026-09-19 were moved to CSS
#     classes for this reason — do not reintroduce style="" on new markup,
#     or this directive will need 'unsafe-inline' and the CSP gets weaker.
#   - img-src: 'self' + data: (placeholder/background assets) +
#     cdn.sanity.io (artwork photos, the only external host the site uses).
#   - connect-src 'self': all Sanity queries (sanityClient.fetch) run in
#     Astro frontmatter at BUILD time in Node, never in the browser — the
#     shipped site makes no client-side network calls, so cdn.sanity.io
#     does not need to be here. If a future feature adds a client-side
#     fetch to Sanity or anywhere else, add that origin here deliberately.
#   - form-action 'self': the contact form posts to the same origin
#     (Netlify Forms intercepts it server-side).
#   - default-src 'none': nothing is allowed unless explicitly listed
#     above/below — the site uses no manifest, worker, iframe, media, or
#     font files beyond system fonts, so none of those directives are
#     needed yet.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.sanity.io; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
